name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs here (Dependabot keeps them current)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same steps as `npm run check`, split up so a failure shows which one
      - name: Type-check
        run: npm run type-check

      - name: Lint (ESLint and the class prefix check)
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Tests
        run: npm run test:coverage

      - name: Build (fails on type declaration errors)
        run: npm run build

      - name: What npm would publish
        run: node scripts/check-package.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
